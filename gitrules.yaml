git_rules_and_pull_request_policy:
  branch_model:
    main:
      status: "Protected"
      access: "No direct commits"
      merge_source: "dev branch only"
      requirements: "Tests must pass"
    dev:
      purpose: "Integration branch"
      access: "No direct commits"
      merge_source: "All features merge here first via PR"
    feature:
      naming: "feature/<name>"
      scope: "One feature/task per branch"
      source: "Create from dev"
    hotfix:
      naming: "hotfix/<name>"
      purpose: "Emergency fixes"
      merge_targets:
        - "main"
        - "dev"
      method: "Via PRs"

  mandatory_pull_requests:
    rules:
      - "All work from feature/* MUST be merged via a Pull Request into dev"
      - "Never merge feature/* directly into main"
      - "main only receives merges from dev"
      - "Do not push commits directly to main or dev"

  pr_requirements:
    ci_checks: "Must pass before merging"
    reviewer_approval:
      minimum: 1
      high_risk_changes: 2
    title_format: "Conventional Commits (e.g., 'feat: add assumption validator UI')"
    scope: "Keep PRs focused; one logical change per PR"
    documentation: "Link related issues and include brief testing notes"

  commit_message_format:
    types:
      feat: "new feature"
      fix: "bug fix"
      docs: "documentation"
      style: "formatting (no logic)"
      refactor: "restructure without behavior change"
      test: "add or update tests"
      chore: "tooling/maintenance"

  local_workflow:
    steps:
      - "git checkout dev && git pull"
      - "git checkout -b feature/<name>"
      - "Work and commit with Conventional Commits"
      - "git push -u origin feature/<name>"
      - "Open PR: feature/<name> -> dev (use GitHub UI or gh pr create)"

  pre_push_protection:
    mandatory: true
    script: |
      #!/bin/sh
      BRANCH=$(git rev-parse --abbrev-ref HEAD)

      # Block direct pushes to protected branches
      if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "dev" ]; then
        echo "Direct pushes to $BRANCH are not allowed. Open a PR instead." >&2
        exit 1
      fi

      # Check for merge conflict markers
      if git diff --cached --name-only | xargs grep -l "<<<<<<<\|=======\|>>>>>>>" > /dev/null 2>&1; then
        echo "Error: Merge conflict markers detected in staged files." >&2
        echo "Please resolve all conflicts before pushing." >&2
        exit 1
      fi

      # Validate branch naming convention
      if ! echo "$BRANCH" | grep -E "^(feature|hotfix)/" > /dev/null && [ "$BRANCH" != "main" ] && [ "$BRANCH" != "dev" ]; then
        echo "Warning: Branch name should follow convention: feature/<name> or hotfix/<name>" >&2
        echo "Current branch: $BRANCH" >&2
        echo "Consider renaming with: git branch -m feature/<name>" >&2
      fi

      exit 0
    installation:
      path: ".githooks/pre-push"
      config: "git config core.hooksPath .githooks"
    setup_commands:
      - "mkdir -p .githooks"
      - "chmod +x .githooks/pre-push"
      - "git config core.hooksPath .githooks"

  worktrees:
    usage:
      - "Use separate worktrees for dev and current feature branches"
      - "After merge, delete feature branch and remove its worktree"

  enforcement:
    protection: "Branch protection on main and dev in GitHub"
    requirements: "PRs required for merges"
    prevention: "Direct pushes blocked server-side"

git_workflow_rules_for_llm_assistants:
  branch_structure:
    main:
      purpose: "Stable, deployable code only"
      protection: "Protected branch - no direct commits"
      updates: "Only via PR/merge from dev after testing"
      llm_rule: "Never suggest direct commits to main"

    dev:
      purpose: "Integration branch for all feature work"
      usage: "All feature branches merge here first"
      testing: "QA and staging testing happens from dev"
      llm_rule: "Merge features here before suggesting main merge"
      truth_source: "dev is truth before main since main is prod"

    feature:
      naming: "feature/<name>"
      examples:
        - "feature/authentication"
        - "feature/user-dashboard"
      lifecycle: "Create → Develop → Test → Merge to dev → Delete"
      llm_rule: "One branch per logical feature or task"

  workflow_commands:
    creating_new_features: |
      # Always start from dev
      git checkout dev
      git pull origin dev
      git checkout -b feature/feature-name

    working_on_features: |
      # Regular development cycle
      git add .
      git commit -m "feat: descriptive commit message"
      git push origin feature/feature-name

    merging_features: |
      # Merge to dev first
      git checkout dev
      git merge feature/feature-name
      git push origin dev

      # Clean up
      git branch -d feature/feature-name
      git push origin --delete feature/feature-name

    promoting_to_production: |
      # Only after dev is tested and stable
      git checkout main
      git merge dev
      git push origin main

  llm_assistant_rules:
    when_to_suggest_branch_changes:
      new_feature: "Create feature/<name> branch"
      bug_fix: "Create hotfix/<name> branch (merges to both dev and main)"
      integration_testing: "Use dev branch"
      production_release: "Use main branch"

    what_not_to_suggest:
      - "Direct commits to main branch"
      - "Pushing untested code to dev"
      - "Working directly on dev for features"
      - "Deleting branches with unmerged work"

    commit_message_format:
      format: "type: short description"
      notes:
        - "DO NOT ADD SIGNATURES OR UNRELATED NOTES"
      types:
        feat: "new feature"
        fix: "bug fix"
        docs: "documentation"
        style: "formatting"
        refactor: "code restructuring"
        test: "adding tests"
        chore: "maintenance"

  worktree_management:
    standard_structure:
      main_directory: "fraqtiv-helix-mvp/"
      dev_directory: "fraqtiv-helix-mvp-dev/"
      feature_directory: "fraqtiv-helix-mvp-feature/"
      descriptions:
        main: "main branch (stable)"
        dev: "dev branch (integration)"
        feature: "current feature work"

    llm_worktree_commands:
      create_dev_worktree: "git worktree add ../fraqtiv-helix-mvp-dev dev"
      create_feature_worktree: "git worktree add ../fraqtiv-helix-mvp-feature feature/current-work"
      list_worktrees: "git worktree list"
      remove_worktree: "git worktree remove ../fraqtiv-helix-mvp-feature"

  safety_checks:
    pre_operation_verification:
      - "Current branch is appropriate for the task"
      - "Working directory is clean (git status)"
      - "Latest changes are pulled (git pull)"
      - "Target branch exists and is up to date"
      - "No merge conflict markers in any files"

  merge_conflict_resolution:
    detection:
      markers: ["<<<<<<<", "=======", ">>>>>>>"]
      common_files: [".agent-os/product/roadmap.md", ".agent-os/product/tech-stack.md", "scripts/migrate-*.ts"]
    prevention:
      pre_push_hook: "Blocks pushes with conflict markers"
      automated_detection: "Scans staged files for markers"
    resolution_guidance:
      strategy: "Take more complete/advanced implementation"
      documentation_files: "Prefer usage-tracking-refactor branch for roadmap.md and tech-stack.md"
      code_files: "Preserve necessary imports and error handling from HEAD"
      testing_files: "Use cleaner mock implementations from feature branches"
    tools:
      conflict_detection: "grep -r '<<<<<<\\|======\\|>>>>>>>' src/ scripts/ .agent-os/"
      clean_resolution: "Use IDE merge conflict resolution tools"
      validation: "git diff --check to ensure no trailing whitespace"

  common_scenarios:
    starting_new_feature_work:
      steps:
        - "Ensure in dev worktree: cd ../fraqtiv-helix-mvp-dev"
        - "Pull latest: git pull origin dev"
        - "Create feature branch: git checkout -b feature/new-feature"
        - "Create feature worktree: git worktree add ../fraqtiv-helix-mvp-feature feature/new-feature"

    code_review_ready:
      steps:
        - "Push feature branch: git push origin feature/branch-name"
        - "Suggest creating PR to dev branch"
        - "Do not merge automatically"

    emergency_hotfix:
      steps:
        - "Create from main: git checkout main && git checkout -b hotfix/urgent-fix"
        - "Fix and test"
        - "Merge to both main and dev"
        - "Tag the release"

  integration_notes:
    agent_os_claude:
      - "These configuration files should exist in main branch"
      - "Feature branches inherit them automatically"
      - "Worktrees share the same .git directory, so configurations persist"
      - "Always commit config changes to appropriate branch first"

  release_management:
    semantic_versioning:
      format: "MAJOR.MINOR.PATCH (e.g., 3.0.0)"
      increment_rules:
        major: "Breaking changes or major feature additions"
        minor: "New features without breaking changes"
        patch: "Bug fixes and minor improvements"
      automation:
        tagging: "Automated on successful dev->main merge"
        changelog: "Generated from conventional commit messages"
        validation: "Tags must follow semantic versioning format"

    tagging_strategy:
      main_branch_tags:
        format: "v{version} (e.g., v3.0.0)"
        conditions: "Only after successful merge from dev with passing tests"
      pre_release_tags:
        format: "v{version}-{prerelease} (e.g., v3.0.0-alpha.1)"
        usage: "For dev branch releases to staging"
      conflict_free_requirement: "No merge conflicts in release commits"

    release_process:
      steps:
        - "Ensure all conflicts resolved in dev branch"
        - "Run full test suite on dev"
        - "Merge dev to main via PR with passing CI"
        - "Create semantic version tag on main"
        - "Push tag to trigger deployment"

  questions_before_git_operations:
    - "What branch should this work be done on?"
    - "Have you pulled the latest changes?"
    - "Is this ready for integration testing?"
    - "Should this go to main or dev first?"
    - "Do you want me to create a new worktree?"
    - "Are there any merge conflicts that need resolution?"
